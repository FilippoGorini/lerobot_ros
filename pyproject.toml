[project]
name = "lerobot-ros"
version = "0.1.0"
description = "Add your description here"
license = "MIT"
readme = "README.md"
dependencies = [
    "lerobot>=0.4.2,<0.5",
    "pytest>=9.0.2",
    "rust-py-timer>=0.1.0",
    # scipy is imported opportunistically by HuggingFace `datasets` when
    # loading existing parquet (e.g. appending episodes to a dataset). The
    # venv uses --system-site-packages, which would otherwise leak in the
    # system scipy (compiled against numpy 1.x) and crash under numpy 2.x
    # with "numpy.core.multiarray failed to import". Pin a numpy-2-compatible
    # scipy so the venv's own copy wins over the system one.
    "scipy>=1.13",
]

[project.optional-dependencies]
so101 = [
    "lerobot[feetech]>=0.4.2",
]
smolvla = [
    "lerobot[smolvla]>=0.4.2",
]

[dependency-groups]
dev = [
    "maturin>=1.11.2",
]

[tool.uv.sources]
lerobot = { git = "https://github.com/huggingface/lerobot.git", rev = "603d44434f432c79765c6e18c290fccac1bd7b3e" }

[tool.ty.environment]
extra-paths = [
    "/opt/ros/jazzy/lib/python3.12/site-packages/",
    "install/lerobot_interfaces/lib/python3.12/site-packages/"
]
